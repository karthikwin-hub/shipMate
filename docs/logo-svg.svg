<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="100%" height="100%">
  <defs>
    <linearGradient id="shipmateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6366F1" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Icon Mark: Hexagon with Ship Bow & Git Branch Node -->
  <g transform="translate(10, 10)">
    <!-- Hexagon Frame -->
    <polygon points="40,4 72,22 72,58 40,76 8,58 8,22" 
             fill="url(#shipmateGrad)" 
             filter="url(#glow)"/>
    
    <!-- Ship Hull & Check/Forward Chevron in White -->
    <path d="M22,35 L40,52 L58,35 L50,35 L40,44 L30,35 Z" fill="#FFFFFF" opacity="0.95"/>
    <path d="M40,20 L55,27 L40,34 L25,27 Z" fill="#FFFFFF"/>
    
    <!-- Connected QA/Prod Check Node -->
    <circle cx="40" cy="58" r="4.5" fill="#FFFFFF"/>
  </g>

  <!-- Wordmark -->
  <text x="100" y="58" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-size="40" 
        font-weight="800" 
        letter-spacing="-0.5" 
        fill="#1E293B">
    Ship<tspan fill="url(#shipmateGrad)">Mate</tspan>
  </text>
  
  <!-- Subtitle Tag -->
  <text x="102" y="76" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" 
        font-size="11" 
        font-weight="600" 
        letter-spacing="1.5" 
        fill="#64748B">
    DEV • QA • PROD PIPELINE
  </text>
</svg>
